name: Daily Index Snapshot & Stage 2 Analysis Sync

on:
#  schedule:
#    - cron: '30 11 * * 1-5'  # Weekdays (Mon-Fri) at 11:30 UTC (17:00 IST / 5:00 PM IST)
  workflow_dispatch:
    inputs:
      force_stage2:
        description: "Bypass the Friday-only check and run Stage 2 Analysis regardless of today's day"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  snapshot_and_stage2:
    name: Breadth Snapshot & Stage 2 Analysis
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15

    steps:
      - name: Validate Configuration
        id: config
        run: |
          BASE_URL="${{ secrets.API_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then
            echo "::error::API_BASE_URL is not configured in environment secrets."
            exit 1
          fi
          BASE_URL=$(echo "$BASE_URL" | sed 's:/*$::')
          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT

      - name: Service Health Check
        run: |
          echo "🔍 Performing pre-flight health check at ${{ steps.config.outputs.base_url }}/health"
          curl -s --fail --max-time 10 "${{ steps.config.outputs.base_url }}/health" || {
            echo "::error::Target service is unreachable or unhealthy."
            exit 1
          }

      - name: Trigger Index & Sector Breadth Snapshot (Everyday)
        env:
          API_TOKEN: ${{ secrets.API_SECRET_TOKEN }}
          BASE_URL: ${{ steps.config.outputs.base_url }}
        run: |
          echo "📈 Triggering daily Index & Sector Breadth Snapshot ($BASE_URL/admin/snapshot-breadth)..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$BASE_URL/admin/snapshot-breadth" \
            -H "Authorization: Bearer $API_TOKEN")
          
          cat response.json
          echo ""
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::Index & Sector Breadth snapshot failed with status $HTTP_STATUS"
            exit 1
          fi
          
          echo "✅ Daily Index & Sector Breadth snapshot triggered successfully."

      - name: Trigger Stage 2 Analysis & Weekly Pulse (Friday Only, unless forced)
        env:
          API_TOKEN: ${{ secrets.API_SECRET_TOKEN }}
          BASE_URL: ${{ steps.config.outputs.base_url }}
          FORCE_STAGE2: ${{ github.event.inputs.force_stage2 }}
        run: |
          DAY_OF_WEEK=$(date +%u)
          if [[ "$DAY_OF_WEEK" -eq 5 || "$FORCE_STAGE2" == "true" ]]; then
            if [[ "$FORCE_STAGE2" == "true" && "$DAY_OF_WEEK" -ne 5 ]]; then
              echo "🔓 Friday check bypassed via force_stage2 input — Triggering Stage 2 Analysis ($BASE_URL/admin/refresh-stages?force=true)..."
              REFRESH_URL="$BASE_URL/admin/refresh-stages?force=true"
            else
              echo "📊 Friday Session Detected — Triggering Stage 2 Analysis ($BASE_URL/admin/refresh-stages)..."
              REFRESH_URL="$BASE_URL/admin/refresh-stages"
            fi

            HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
              "$REFRESH_URL" \
              -H "Authorization: Bearer $API_TOKEN")
            cat response.json
            echo ""

            if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
              echo "::error::Stage Analysis failed with status $HTTP_STATUS"
              exit 1
            fi
            echo "✅ Stage 2 Analysis and pulse history updated successfully."
          else
            echo "ℹ️ Skipping Stage 2 Analysis (Today is Day $DAY_OF_WEEK, Stage 2 analysis runs on Fridays only unless force_stage2 is set)."
          fi
