name: Daily AMC Holdings Sync

on:
#  schedule:
#    - cron: '0 2 * * *'  # 2:00 AM UTC daily
  workflow_dispatch:
    inputs:
      month:
        description: 'Month (1-12)'
        required: false
        default: ''
      year:
        description: 'Year (e.g. 2026)'
        required: false
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync_amc_holdings:
    name: AMC Holdings & Deltas Sync
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    steps:
      - name: Validate Configuration
        id: config
        run: |
          BASE_URL="${{ secrets.API_BASE_URL }}"
          if [[ -z "$BASE_URL" ]]; then
            echo "::error::API_BASE_URL is not configured in environment secrets."
            exit 1
          fi
          BASE_URL=$(echo "$BASE_URL" | sed 's:/*$::')
          echo "base_url=$BASE_URL" >> $GITHUB_OUTPUT

          # Determine Month and Year. AMC portfolio disclosures lag ~1 calendar
          # month (e.g. July's holdings are published in August), so default to
          # the PREVIOUS month, not the current one -- syncing "this month" every
          # day was targeting a report that doesn't exist yet for most of the month.
          MONTH="${{ github.event.inputs.month }}"
          YEAR="${{ github.event.inputs.year }}"
          if [[ -z "$MONTH" || -z "$YEAR" ]]; then
            MONTH=$(date -d "-1 month" +%-m)
            YEAR=$(date -d "-1 month" +%Y)
          fi
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "year=$YEAR" >> $GITHUB_OUTPUT

      - name: Service Health Check
        run: |
          echo "🔍 Performing pre-flight health check at ${{ steps.config.outputs.base_url }}/health"
          curl -s --fail --max-time 10 "${{ steps.config.outputs.base_url }}/health" || {
            echo "::error::Target service is unreachable or unhealthy."
            exit 1
          }

      - name: Trigger AMC Holdings Sync
        env:
          API_TOKEN: ${{ secrets.API_SECRET_TOKEN }}
          BASE_URL: ${{ steps.config.outputs.base_url }}
          MONTH: ${{ steps.config.outputs.month }}
          YEAR: ${{ steps.config.outputs.year }}
        run: |
          echo "Triggering AMC Holdings sync for Month: $MONTH, Year: $YEAR..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            "$BASE_URL/amc/sync?month=$MONTH&year=$YEAR" \
            -H "Authorization: Bearer $API_TOKEN")
          
          cat response.json
          if [[ "$HTTP_STATUS" -lt 200 || "$HTTP_STATUS" -ge 300 ]]; then
            echo "::error::AMC Holdings sync failed with status $HTTP_STATUS"
            exit 1
          fi
          
          echo "✅ AMC Holdings sync task successfully triggered."
