name: Daily Concall Analysis

on:
  schedule:
    # Run every 2 hours
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  trigger-bulk-concall-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: SITE_URL
    steps:
      - name: Trigger Bulk Concall Analysis API
        run: |
          echo "🚀 Triggering daily bulk concall analysis via API..."
          curl -s -L -f "${{ vars.SITE_URL }}/api/cron/daily-concall-links?days=3&key=${{ vars.CRON_SECRET }}" || echo "⚠️ Warning: Concall analysis API trigger failed"
          echo "✅ API successfully triggered the background job"
